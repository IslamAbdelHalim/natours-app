openapi: 3.0.0

info:
  title: natours API
  description: API for tour application
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1

paths:
  /tours:
    get:
      summary: Return List of tours
      description: api for getting all tours
      responses:
        "200":
          description: A json array of tours
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  results:
                    type: integer
                  data:
                    $ref: "#/components/schemas/Tour"
    post:
      summary: create a new tour
      description: add a new tour to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tour'
      responses:
        "201":
          description: created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    $ref: "#/components/schemas/Tour"
        "400":
          description: Invalid Input
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string


components:
  schemas:
    Tour:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        duration:
          type: integer
        maxGroupSize:
          type: integer
        difficulty:
          type: string
          enum:
            - "easy"
            - "medium"
            - "difficult"
        ratingsAverage:
          type: number
        ratingsQuantity:
          type: number
        price:
          type: number
        summary:
          type: string
        description:
          type: string
        imageCover:
          type: string
        images:
          type: array
          items:
            type: string
        startDates:
          type: array
          items:
            type: string
        startLocation:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
        locations:
          type: array
          items:
            type: object
            properties:
              latitude:
                type: number
              longitude:
                type: number
        guides:
          type: array
          items:
            type: string